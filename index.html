<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>ヨガのメニュー</title>

    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
<main class="wrap">
<!-- 選択画面 -->
<div id="pose_box">
    <h1>今日のヨガ何する？</h1>

    <section>

        <p class="text text--explain">ヨガはたくさんポーズがあって何をやるか迷いますよね。<br>選択肢を選ぶとポーズを表示します。<br>メニューを変えたい時は再度選択肢を押してください。</p>


        <div class="select_contents bg-light-subtle text-center p-3 mb-3" id="purpose">
            <h2 class="border-top pt-3 fw-bold mb-3">目的</h2>
            <div class="select_btns">
                <button class="btn btn-primary" data-question="1" onclick="recordSelection(1,1,this)">リラクゼーション</button>
                <button class="btn btn-primary" data-question="1" onclick="recordSelection(1,2,this)">筋トレあり</button>
                <button class="btn btn-primary" data-question="1" onclick="recordSelection(1,3,this)">太陽礼拝1</button>
                <button class="btn btn-primary" data-question="1" onclick="recordSelection(1,4,this)">太陽礼拝2</button>
            </div>
        </div>


        <div class="select_contents bg-light-subtle text-center p-3 mb-3" id="difficulty">
            <h2 class="border-top pt-3 fw-bold mb-3">難易度</h2>
            <div class="select_btns">
                <button class="btn btn-primary" data-question="2" onclick="recordSelection(2,1,this)">初心者</button>
                <button class="btn btn-primary" data-question="2" onclick="recordSelection(2,2,this)">慣れた人</button>
            </div>
        </div>

        <div class="select_contents bg-light-subtle text-center p-3 mb-3" id="time">
            <h2 class="border-top pt-3 fw-bold  mb-3">時間</h2>
            <div class="select_btns">
                <button class="btn btn-primary" data-question="3" onclick="recordSelection(3,1,this)">30分</button>
                <button class="btn btn-primary" data-question="3" onclick="recordSelection(3,2,this)">60分</button>
            </div>
        </div>
    </section>

    <section id="result" class="result select_contents">
        <h2 class="text-center fw-bold border-top pt-3 mb-2">メニュー表示</h2>
        <div class="result__pose"></div>
    </section>
</div>
</main>
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/yogaData.js"></script>
    <script type="module" src="js/yoga.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
